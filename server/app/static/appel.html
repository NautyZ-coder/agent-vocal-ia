<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<!-- "Ajouter à l'écran d'accueil" => s'ouvre en plein écran, sans barre de navigateur -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{GARAGE_NAME}}">
<link rel="apple-touch-icon" href="/appel-icon.png">
<title>{{GARAGE_NAME}}</title>
<style>
  :root {
    --bg1: #121820; --bg2: #05070a; --fg: #f4f6f8; --muted: #9aa4b0;
    --green: #30d158; --red: #ff453a; --btn: rgba(255,255,255,.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, var(--bg1), var(--bg2));
    color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: max(56px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom));
    user-select: none; overflow: hidden;
  }
  .top { text-align: center; margin-top: 4vh; }
  .avatar {
    width: 112px; height: 112px; border-radius: 50%; margin: 0 auto 20px;
    background: linear-gradient(145deg, #3a4452, #1d232b);
    display: grid; place-items: center; font-size: 40px; font-weight: 600; letter-spacing: 1px;
    position: relative;
  }
  .avatar::after {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 2px solid var(--green); opacity: 0; transform: scale(.92); transition: opacity .2s;
  }
  body.speaking .avatar::after { opacity: .9; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(.94); } 50% { transform: scale(1.04); } }
  h1 { font-size: 30px; font-weight: 500; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 17px; min-height: 24px; }
  .timer { font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .controls { display: flex; gap: 40px; align-items: flex-end; justify-content: center; width: 100%; }
  .ctl { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  button {
    width: 76px; height: 76px; border-radius: 50%; border: 0; cursor: pointer;
    display: grid; place-items: center; color: #fff; background: var(--btn);
    transition: transform .1s, background .2s;
  }
  button:active { transform: scale(.94); }
  button svg { width: 32px; height: 32px; }
  #call { background: var(--green); }
  body.incall #call { background: var(--red); }
  body.incall #call svg { transform: rotate(135deg); }
  #mute.on { background: #fff; color: #111; }
  #mute { visibility: hidden; }
  body.incall #mute { visibility: visible; }
  .code { margin-top: 18px; display: none; }
  .code input {
    background: var(--btn); border: 0; border-radius: 12px; color: var(--fg);
    padding: 12px 14px; font-size: 16px; width: 220px; text-align: center;
  }
  body.needcode .code { display: block; }
  .note { color: var(--muted); font-size: 12px; margin-top: 28px; text-align: center; max-width: 320px; }
</style>
</head>
<body>
  <div class="top">
    <div class="avatar" id="initials"></div>
    <h1>{{GARAGE_NAME}}</h1>
    <div class="sub"><span id="status">Accueil téléphonique</span> <span class="timer" id="timer"></span></div>
    <div class="code"><input id="code" placeholder="Code d'accès" autocomplete="off"></div>
  </div>
  <div class="spacer"></div>
  <div class="controls">
    <div class="ctl">
      <button id="mute" aria-label="Couper le micro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <span id="mutelabel" style="visibility:hidden">muet</span>
    </div>
    <div class="ctl">
      <button id="call" aria-label="Appeler">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
      </button>
      <span id="calllabel">appeler</span>
    </div>
  </div>
  <div class="note">L'accueil {{PLACE}} est assuré par une IA</div>

<script>
(() => {
  const SR = 16000;              // format audio échangé avec le serveur
  const qs = new URLSearchParams(location.search);
  const garage = qs.get("g") || "";
  const fullDuplex = qs.get("duplex") === "1";   // par défaut : micro coupé pendant que l'agent parle (anti-écho haut-parleur)
  const $ = (id) => document.getElementById(id);
  const name = document.title.trim();
  $("initials").textContent = name.split(/\s+/).filter(w => /^[A-Za-zÀ-ÿ]/.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join("");

  let code = qs.get("code") || "";
  try { code = code || localStorage.getItem("callcode") || ""; } catch (e) {}
  if (!code) document.body.classList.add("needcode");

  let ctx, stream, node, ws, muted = false, nextTime = 0, sources = [], t0 = 0, timerId, ending = false;

  const setStatus = (s) => { $("status").textContent = s; };
  const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  const botSpeaking = () => ctx && ctx.currentTime < nextTime + 0.25;

  const workletCode = `
    class Mic extends AudioWorkletProcessor {
      constructor(o) { super(); this.ratio = sampleRate / ${SR}; this.pos = 0; this.buf = new Int16Array(960); this.n = 0; }
      process(inputs) {
        const ch = inputs[0] && inputs[0][0];
        if (!ch) return true;
        // rééchantillonnage linéaire vers 16 kHz
        while (this.pos < ch.length - 1) {
          const i = Math.floor(this.pos), f = this.pos - i;
          const v = ch[i] * (1 - f) + ch[i + 1] * f;
          this.buf[this.n++] = Math.max(-1, Math.min(1, v)) * 0x7fff;
          if (this.n === this.buf.length) { this.port.postMessage(this.buf.buffer.slice(0)); this.n = 0; }
          this.pos += this.ratio;
        }
        this.pos -= ch.length;
        return true;
      }
    }
    registerProcessor("mic", Mic);`;

  function play(bytes) {
    const pcm = new Int16Array(bytes);
    if (!pcm.length) return;
    const buf = ctx.createBuffer(1, pcm.length, SR);
    const out = buf.getChannelData(0);
    for (let i = 0; i < pcm.length; i++) out[i] = pcm[i] / 0x8000;
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination);
    nextTime = Math.max(nextTime, ctx.currentTime + 0.05);
    src.start(nextTime);
    nextTime += buf.duration;
    sources.push(src);
    src.onended = () => { sources = sources.filter(s => s !== src); };
  }

  function clearPlayback() {
    sources.forEach(s => { try { s.stop(); } catch (e) {} });
    sources = []; nextTime = 0;
  }

  async function start() {
    if (!code) {
      code = $("code").value.trim();
      if (!code) { $("code").focus(); return; }
    }
    try { localStorage.setItem("callcode", code); } catch (e) {}
    document.body.classList.remove("needcode");
    document.body.classList.add("incall");
    $("calllabel").textContent = "raccrocher";
    setStatus("Appel…");
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      await ctx.resume();
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      const url = URL.createObjectURL(new Blob([workletCode], { type: "application/javascript" }));
      await ctx.audioWorklet.addModule(url);
      node = new AudioWorkletNode(ctx, "mic");
      ctx.createMediaStreamSource(stream).connect(node);
    } catch (e) {
      console.error(e); setStatus("Micro indisponible"); stop(false); return;
    }
    // Sonnerie "tuuut… tuuut…" avant que Léa décroche (440 Hz, comme en France)
    setStatus("Appel…");
    try {
      for (let i = 0; i < 2 && document.body.classList.contains("incall"); i++) {
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.frequency.value = 440; g.gain.value = 0.12;
        osc.connect(g).connect(ctx.destination);
        osc.start(); await new Promise(r => setTimeout(r, 1500)); osc.stop();
        await new Promise(r => setTimeout(r, 2000));
      }
    } catch (e) { return; }
    if (!document.body.classList.contains("incall")) return;
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws-web?code=${encodeURIComponent(code)}&g=${encodeURIComponent(garage)}`);
    ws.binaryType = "arraybuffer";
    ws.onopen = () => {
      setStatus(""); t0 = Date.now();
      $("timer").textContent = "00:00";
      timerId = setInterval(() => { $("timer").textContent = fmt(Math.floor((Date.now() - t0) / 1000)); }, 500);
    };
    ws.onmessage = (ev) => {
      if (typeof ev.data === "string") {
        const m = JSON.parse(ev.data);
        if (m.type === "clear") clearPlayback();
        if (m.type === "end") { ending = true; setTimeout(() => stop(true), Math.max(0, (nextTime - ctx.currentTime) * 1000) + 300); }
        return;
      }
      play(ev.data);
    };
    ws.onclose = (ev) => {
      if (ev.code === 4003) { try { localStorage.removeItem("callcode"); } catch (e) {} code = ""; setStatus("Code d'accès refusé"); document.body.classList.add("needcode"); stop(false); return; }
      if (ev.code === 4029) { setStatus("Ligne occupée"); stop(false); return; }
      if (!ending) { stop(false); setStatus(`Appel coupé (réseau, code ${ev.code})`); }
    };
    node.port.onmessage = (ev) => {
      if (!ws || ws.readyState !== 1) return;
      const silent = muted || (!fullDuplex && botSpeaking());
      ws.send(silent ? new ArrayBuffer(ev.data.byteLength) : ev.data);
    };
    const loop = () => { document.body.classList.toggle("speaking", botSpeaking()); if (ctx) requestAnimationFrame(loop); };
    loop();
  }

  function stop(finished) {
    clearInterval(timerId);
    try { ws && ws.readyState <= 1 && ws.close(); } catch (e) {}
    try { stream && stream.getTracks().forEach(t => t.stop()); } catch (e) {}
    try { ctx && ctx.close(); } catch (e) {}
    ws = stream = node = ctx = null; sources = []; nextTime = 0; ending = false; muted = false;
    $("mute").classList.remove("on"); $("mutelabel").style.visibility = "hidden";
    document.body.classList.remove("incall", "speaking");
    $("calllabel").textContent = "appeler";
    if (finished) setStatus("Appel terminé");
  }

  $("call").onclick = () => (document.body.classList.contains("incall") ? stop(true) : start());
  $("mute").onclick = () => {
    muted = !muted;
    $("mute").classList.toggle("on", muted);
    $("mutelabel").style.visibility = muted ? "visible" : "hidden";
  };
})();
</script>
</body>
</html>
