# Agent vocal IA — déploiement Docker
#
# Cas A : rien n'écoute encore sur les ports 80/443 du VPS
#   docker compose --profile caddy up -d --build        (Caddy inclus : HTTPS automatique)
#
# Cas B : tu as déjà un reverse proxy dans Docker (Caddy/Traefik devant n8n, par ex.)
#   mets PROXY_NETWORK=<nom du réseau Docker de ton proxy> dans server/.env, puis :
#   docker compose --env-file server/.env -f docker-compose.yml -f docker-compose.proxy.yml up -d --build
services:
  voice-agent:
    build: ./server
    container_name: voice-agent
    restart: unless-stopped
    env_file: ./server/.env
    volumes:
      - ./server/tenants:/app/tenants:ro   # ajouter un garage = ajouter un YAML + restart
      - ./server/data:/app/data
    # Plafonds : l'agent ne peut jamais prendre toutes les ressources du VPS (n8n reste tranquille)
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # Accessible seulement en local : un reverse proxy installé hors Docker (Caddy/Nginx) peut joindre 127.0.0.1:8765.
    ports:
      - "127.0.0.1:8765:8765"

  caddy:
    profiles: ["caddy"]
    image: caddy:2
    restart: unless-stopped
    env_file: ./server/.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
